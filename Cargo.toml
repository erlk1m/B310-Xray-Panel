[package]
name = "b310-xray-panel"
version = "0.1.0"
edition = "2021"
description = "Lightweight custom Xray/V2Ray Web UI and process manager for Huawei B310s-927"

[dependencies]
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
